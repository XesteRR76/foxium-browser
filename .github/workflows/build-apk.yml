name: Build Foxium Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK (Release & Debug)
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Rename & Prepare APK Artifact
        run: |
          mkdir -p build/outputs/artifacts
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build/outputs/artifacts/Foxium-Browser-Release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build/outputs/artifacts/Foxium-Browser-Debug.apk
          fi

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Foxium-Browser-APKs
          path: build/outputs/artifacts/*.apk
          retention-days: 14

      - name: Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/artifacts/Foxium-Browser-Release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
